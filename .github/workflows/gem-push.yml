name: Ruby Gem

on:
  push:
    branches: [ "onward" ]
    paths: [ "lib/tracking_number/version.rb" ]
  pull_request:

jobs:
  build:
    name: Build + Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        persist-credentials: false
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '4.0'
        bundler-cache: true
    - name: Test
      run: bundle exec rake test
    - name: Check the built gem detects carriers
      run: |
        gem build *.gemspec
        gem install ./tracking_number-*.gem
        ruby -e 'require "tracking_number"; abort "gem detects no carriers" unless TrackingNumber.new("1Z5R89390357567127").courier_code == :ups && TrackingNumber.new("YWE00000000000001").courier_code == :ywe'
    - name: Publish to Github Package Registry (GPR)
      if: github.event_name == 'push'
      run: |
        mkdir -p $HOME/.gem
        touch $HOME/.gem/credentials
        chmod 0600 $HOME/.gem/credentials
        printf -- "---\n:github: ${GEM_HOST_API_KEY}\n" > $HOME/.gem/credentials
        gem push --KEY github --host https://rubygems.pkg.github.com/${OWNER} *.gem
      env:
        GEM_HOST_API_KEY: "Bearer ${{secrets.GITHUB_TOKEN}}"
        OWNER: ${{ github.repository_owner }}
